<style>
@font-face { font-family: "Newsreader"; src: url("/assets/fonts/newsreader.woff2") format("woff2"); font-weight: 200 800; font-display: swap; }
@font-face { font-family: "Inter"; src: url("/assets/fonts/inter.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "Amiri Name"; src: url("/assets/fonts/amiri-name.woff2") format("woff2"); font-display: swap; }
:root {
  color-scheme: light dark;
  --bg: #FAFAF8; --ink: #151715; --soft: #6B6F69; --line: rgba(21,23,21,.10); --accent: #0B6E7C;
  --serif: "Newsreader", Georgia, serif;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --pad: clamp(1.5rem, 6vw, 6rem);
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0E0F0E; --ink: #ECEDE9; --soft: #969A93; --line: rgba(236,237,233,.11); --accent: #78C9D3; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 1.0625rem; line-height: 1.6; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 6px; }
::selection { background: var(--accent); color: var(--bg); }

.page { max-width: 72rem; margin: 0 auto; padding: 0 var(--pad); min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; }

.top { display: flex; justify-content: space-between; gap: 1rem; padding-block: 2.25rem; color: var(--soft); font-size: .9375rem; }

.hero { padding-block: clamp(3.5rem, 13vh, 8rem) clamp(4.5rem, 13vh, 8rem); }
h1 { margin: 0; display: grid; gap: .12em; font-family: var(--serif); font-weight: 300; font-size: clamp(3.25rem, 10.5vw, 8.75rem); line-height: .95; letter-spacing: -0.04em; }
h1 .ar { font-family: "Amiri Name", serif; font-weight: 400; font-size: .6em; line-height: 1.4; letter-spacing: 0; color: var(--accent); }
.line { margin: clamp(1.75rem, 4vh, 2.75rem) 0 0; font-family: var(--serif); font-weight: 350; font-size: clamp(1.35rem, 2.4vw, 1.85rem); line-height: 1.35; letter-spacing: -0.01em; color: var(--soft); text-wrap: balance; }

.apps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2.5rem; }
.apps a { display: grid; gap: .25rem; }
.apps img { width: 4.25rem; height: 4.25rem; border-radius: 23%; box-shadow: 0 0 0 1px var(--line); margin-bottom: .85rem; transition: transform .35s cubic-bezier(.2,.7,.2,1); }
.apps b { font-family: var(--serif); font-weight: 400; font-size: 1.5rem; letter-spacing: -0.015em; transition: color .2s; }
.apps span { color: var(--soft); font-size: .9688rem; }
@media (hover: hover) {
  .apps a:hover img { transform: translateY(-4px); }
  .apps a:hover b { color: var(--accent); }
}

.foot { margin-top: auto; padding-block: 5.5rem 2.25rem; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem; color: var(--soft); font-size: .9375rem; }
.foot nav { display: flex; gap: 1.75rem; }
.foot a:hover { color: var(--ink); }

@media (max-width: 52rem) { .apps { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2.5rem 1.5rem; } }

@media (prefers-reduced-motion: no-preference) {
  .fade { animation: fade 1s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i, 0) * 120ms); }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } }
}
</style>
</head>
<body>
<div class="page">
  <header class="top fade">
    <span>Software engineer</span>
    <span>Kuwait</span>
  </header>

  <main>
    <section class="hero">
      <h1 class="fade" style="--i:1">
        <span>Ahmad Almazeedi</span>
        <span class="ar" lang="ar" dir="rtl">أحمد المزيدي</span>
      </h1>
      <p class="line fade" style="--i:2">Useful and beautiful software, made for everyone.</p>
    </section>

    <ul class="apps fade" style="--i:3" aria-label="Work">
      <li><a href="https://atmita.com/"><img src="/assets/icons/atmita.png" alt="" width="68" height="68"><b>Atmita</b><span>Personal AI agent</span></a></li>
      <li><a href="https://apps.apple.com/us/app/haseba-calculator-converter/id1121281655"><img src="/assets/icons/haseba.png" alt="" width="68" height="68"><b>Haseba</b><span>Calculator, 1.3M downloads</span></a></li>
      <li><a href="https://apps.apple.com/us/app/animath-ai-tutor-solver/id1615638274"><img src="/assets/icons/animath.png" alt="" width="68" height="68"><b>Animath</b><span>Algebra, step by step</span></a></li>
      <li><a href="https://ilostcount.com/"><img src="/assets/icons/ilostcount.png" alt="" width="68" height="68"><b>iLostCount</b><span>Word and token counter</span></a></li>
    </ul>
  </main>

  <footer class="foot">
    <nav aria-label="Elsewhere">
      <a href="https://github.com/ahmad-almazeedi">GitHub</a>
      <a href="https://x.com/Ahmad_ALMazeedi">X</a>
      <a href="https://www.linkedin.com/in/ahmad-almazeedi-b4657ba8">LinkedIn</a>
    </nav>
    <span>© 2026</span>
  </footer>
</div>
</body>
</html>
