<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ahmad Almazeedi</title>
<meta name="description" content="Ahmad Almazeedi, software engineer in Kuwait. Useful and beautiful software, made for everyone: Atmita, Haseba, Animath and iLostCount.">
<link rel="canonical" href="https://ahmad-almazeedi.github.io/">
<meta name="theme-color" content="#F7F7F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D0E0D" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:title" content="Ahmad Almazeedi">
<meta property="og:description" content="Useful and beautiful software, made for everyone.">

<meta property="og:image" content="https://ahmad-almazeedi.github.io/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/assets/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: "Nunito"; src: url("/assets/fonts/nunito-latin.woff2") format("woff2"); font-weight: 200 1000; font-display: swap; }
@font-face { font-family: "Baloo Bhaijaan 2"; src: url("/assets/fonts/baloo-bhaijaan-2-arabic.woff2") format("woff2"); font-weight: 400 800; font-display: swap; }
:root {
  color-scheme: light dark;
  --bg: #F7F7F4; --ink: #141614; --soft: #71756F; --line: rgba(20,22,20,.08); --accent: #0B7A88;
  --font: "Nunito", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --heavy: 900;
  --pad: clamp(1.25rem, 5vw, 5rem);
  --tile: #EFEFEB; --glow: .45; --lift: 1.9; --emoji-glow: .32;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0D0E0D; --tile: #161716; --glow: .55; --lift: 1; --emoji-glow: .4; --ink: #EEEFEB; --soft: #9A9E97; --line: rgba(238,239,235,.09); --accent: #6FD0DC;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 1.0625rem; line-height: 1.55; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
a:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; border-radius: 2rem; }
::selection { background: var(--accent); color: var(--bg); }

.page { max-width: 74rem; margin: 0 auto; padding: 0 var(--pad); min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; }
.top { display: flex; justify-content: space-between; gap: 1rem; padding-block: 2rem; color: var(--soft); font-weight: 600; }

.hero { padding-block: clamp(3rem, 11vh, 7rem) clamp(3.5rem, 10vh, 6rem); }
h1 { margin: 0; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .1em .6em; font-weight: var(--heavy); font-size: clamp(3rem, 9vw, 7.5rem); line-height: .98; letter-spacing: -0.035em; }
h1 .ar { font-family: "Baloo Bhaijaan 2", var(--font); font-weight: 800; font-size: .72em; letter-spacing: 0; line-height: 1.2; color: var(--accent); }
.line { margin: 1.5rem 0 0; font-weight: 700; font-size: clamp(1.3rem, 2.4vw, 1.75rem); line-height: 1.3; color: var(--soft); letter-spacing: -0.01em; }

.apps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(2rem, 3.5vw, 3rem) clamp(.875rem, 1.6vw, 1.25rem); }
.apps a { display: grid; gap: 1.1rem; }
.tile { position: relative; display: grid; place-items: center; aspect-ratio: 5 / 4; border-radius: 2.25rem; overflow: hidden; background: var(--tile); isolation: isolate; }
.tile .glow { position: absolute; inset: -30%; width: 160%; height: 160%; object-fit: cover; filter: blur(80px) saturate(2.2) brightness(var(--lift)); opacity: var(--glow); z-index: -1; }
.tile .icon { width: 46%; height: auto; aspect-ratio: 1; border-radius: 23%; box-shadow: 0 0 0 1px rgba(255,255,255,.06), 0 40px 80px -30px rgba(0,0,0,.55); }
.tile.emoji { background: radial-gradient(60% 70% at 50% 50%, rgba(56,132,255,var(--emoji-glow)), transparent 75%), var(--tile); }
.tile.emoji .icon { width: auto; aspect-ratio: auto; border-radius: 0; box-shadow: none; font-size: clamp(6rem, 17vw, 13rem); line-height: 1; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; filter: drop-shadow(0 30px 40px rgba(0,0,0,.35)); }
.cap { display: flex; align-items: baseline; gap: .75rem; padding-inline: .35rem; }
.cap b { font-weight: var(--heavy); font-size: 1.5rem; letter-spacing: -0.02em; }
.cap span { margin-inline-start: auto; color: var(--soft); font-weight: 700; }

.foot { margin-top: auto; padding-block: 4.5rem 2rem; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem; color: var(--soft); font-weight: 600; }
.foot nav { display: flex; gap: 1.75rem; }
.foot a:hover { color: var(--ink); }

@media (max-width: 44rem) {
  .apps { grid-template-columns: 1fr; }
  h1 { flex-direction: column; align-items: flex-start; }
}
@media (prefers-reduced-motion: no-preference) {
  .fade { animation: fade .9s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i, 0) * 110ms); }
  @keyframes fade { from { opacity: 0; transform: translateY(10px); } }
}
</style>
</head>
<body>
<div class="page">
  <header class="top fade">
    <span>Software engineer</span>
    <span>Kuwait</span>
  </header>

  <main>
    <section class="hero">
      <h1 class="fade" style="--i:1">
        <span>Ahmad Almazeedi</span>
        <span class="ar" lang="ar" dir="rtl">أحمد المزيدي</span>
      </h1>
      <p class="line fade" style="--i:2">Useful and beautiful software, made for everyone.</p>
    </section>

    <ul class="apps" aria-label="Work">
      <li class="fade" style="--i:3"><a href="https://atmita.com/">
        <div class="tile"><img class="glow" src="/assets/icons/atmita.png" alt=""><img class="icon" src="/assets/icons/atmita.png" alt="" width="360" height="360"></div>
        <div class="cap"><b>Atmita</b><span>AI agent</span></div>
      </a></li>
      <li class="fade" style="--i:4"><a href="https://apps.apple.com/us/app/haseba-calculator-converter/id1121281655">
        <div class="tile" style="--glow:.18"><img class="glow" src="/assets/icons/haseba.png" alt=""><img class="icon" src="/assets/icons/haseba.png" alt="" width="360" height="360"></div>
        <div class="cap"><b>Haseba</b><span>1.3M downloads</span></div>
      </a></li>
      <li class="fade" style="--i:5"><a href="https://apps.apple.com/us/app/animath-ai-tutor-solver/id1615638274">
        <div class="tile"><img class="glow" src="/assets/icons/animath.png" alt=""><img class="icon" src="/assets/icons/animath.png" alt="" width="360" height="360"></div>
        <div class="cap"><b>Animath</b><span>Algebra</span></div>
      </a></li>
      <li class="fade" style="--i:6"><a href="https://ilostcount.com/">
        <div class="tile emoji"><span class="icon" role="img" aria-label="iLostCount">🔢</span></div>
        <div class="cap"><b>iLostCount</b><span>Counter</span></div>
      </a></li>
    </ul>
  </main>

  <footer class="foot">
    <nav aria-label="Elsewhere">
      <a href="https://github.com/ahmad-almazeedi">GitHub</a>
      <a href="https://x.com/Ahmad_ALMazeedi">X</a>
      <a href="https://www.linkedin.com/in/ahmad-almazeedi-b4657ba8">LinkedIn</a>
    </nav>
    <span>© 2026</span>
  </footer>
</div>
</body>
</html>
