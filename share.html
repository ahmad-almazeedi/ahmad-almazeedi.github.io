<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Share card</title>
<style>
@font-face { font-family: "Newsreader"; src: url("/assets/fonts/newsreader.woff2") format("woff2"); font-weight: 200 800; }
@font-face { font-family: "Inter"; src: url("/assets/fonts/inter.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Amiri Name"; src: url("/assets/fonts/amiri-name.woff2") format("woff2"); }
html,body{margin:0}
body{width:1200px;height:630px;background:#F4F6F5;color:#0F1A1C;font-family:"Inter",sans-serif;display:flex;flex-direction:column;justify-content:space-between;padding:64px 80px;box-sizing:border-box;-webkit-font-smoothing:antialiased}
.top{display:flex;justify-content:space-between;font-size:24px;color:#55666A}
h1{margin:0;font-family:"Newsreader",serif;font-weight:300;font-size:136px;line-height:.94;letter-spacing:-0.035em;display:grid;gap:.1em}
h1 .ar{font-family:"Amiri Name",serif;font-size:.74em;line-height:1.3;letter-spacing:0;text-align:right;color:#0E6C7A}
p{margin:0;font-family:"Newsreader",serif;font-weight:350;font-size:38px;letter-spacing:-0.01em}
</style></head>
<body><div class="top"><span>Software engineer</span><span>Kuwait</span></div>
<h1><span>Ahmad Almazeedi</span><span class="ar" lang="ar" dir="rtl">أحمد المزيدي</span></h1>
<p>Useful and beautiful software, made for everyone.</p></body></html>
